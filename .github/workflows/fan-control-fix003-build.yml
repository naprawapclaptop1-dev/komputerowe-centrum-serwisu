name: Fan Control PRO AI FIX003 — Windows x64 + Setup
on:
  push:
    branches:
      - fan-control-pro-ai-fix003-installer-safety
    paths:
      - 'NAPRAWA_PC_FAN_CONTROL_PRO_AI_FIX002/**'
      - '.github/workflows/fan-control-fix003-build.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NAPRAWA_PC_FAN_CONTROL_PRO_AI_FIX002/NAPRAWA_PC_FAN_CONTROL_PRO_AI.csproj
      - name: Publish Windows x64
        run: dotnet publish NAPRAWA_PC_FAN_CONTROL_PRO_AI_FIX002/NAPRAWA_PC_FAN_CONTROL_PRO_AI.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o artifacts/NaprawaPCFanControl
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "ISCC.exe not found after Inno Setup installation." }
          & $iscc "NAPRAWA_PC_FAN_CONTROL_PRO_AI_FIX002/INSTALLER.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }
      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path artifacts/NaprawaPCFanControl/* -DestinationPath artifacts/NAPRAWA_PC_FAN_CONTROL_PRO_AI_2.0.1_FIX003_PORTABLE.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NAPRAWA_PC_FAN_CONTROL_PRO_AI_2.0.1_FIX003_RELEASE
          path: |
            artifacts/NAPRAWA_PC_FAN_CONTROL_PRO_AI_2.0.1_FIX003_PORTABLE.zip
            artifacts/installer/NaprawaPC_FanControl_PRO_AI_2.0.1_FIX003_Setup.exe
          retention-days: 90