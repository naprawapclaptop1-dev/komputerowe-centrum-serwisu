name: Fan Control PRO AI FIX002 — Windows x64 Build
on:
  push:
    branches:
      - fan-control-pro-ai-fix002-zero
    paths:
      - 'NAPRAWA_PC_FAN_CONTROL_PRO_AI_FIX002/**'
      - '.github/workflows/fan-control-fix002-build.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore NAPRAWA_PC_FAN_CONTROL_PRO_AI_FIX002/NAPRAWA_PC_FAN_CONTROL_PRO_AI.csproj
      - name: Publish Windows x64
        run: dotnet publish NAPRAWA_PC_FAN_CONTROL_PRO_AI_FIX002/NAPRAWA_PC_FAN_CONTROL_PRO_AI.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o artifacts/NaprawaPCFanControl
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/NaprawaPCFanControl/* -DestinationPath artifacts/NAPRAWA_PC_FAN_CONTROL_PRO_AI_2.0.0_FIX002_WIN_X64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NAPRAWA_PC_FAN_CONTROL_PRO_AI_2.0.0_FIX002_WIN_X64
          path: artifacts/NAPRAWA_PC_FAN_CONTROL_PRO_AI_2.0.0_FIX002_WIN_X64.zip
          retention-days: 90