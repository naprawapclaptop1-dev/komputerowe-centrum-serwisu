<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Diagnostyka krok po kroku — metoda</title><desc id="desc">Metodyczne przejście od objawu przez wywiad i pomiary do testu potwierdzającego.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#0b2340"/></linearGradient>
 <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0d3f6a"/><stop offset="1" stop-color="#0b2644"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1d7e8"/><stop offset=".5" stop-color="#567d9e"/><stop offset="1" stop-color="#dce9f4"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a5275" stroke-opacity=".22" stroke-width="1"/></pattern>
 <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#36e0d0"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><rect width="1600" height="900" rx="32" fill="url(#grid)"/>
<rect x="28" y="26" width="1544" height="128" rx="24" fill="url(#head)" stroke="#3d80b5" stroke-width="2"/>
<text x="70" y="72" fill="#36e0d0" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">ATLAS TECHNICZNY / FIX51</text>
<text x="70" y="119" fill="#eff7ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Diagnostyka krok po kroku — metoda</text>
<text x="70" y="196" fill="#a9c2da" font-family="Arial,sans-serif" font-size="24">Metodyczne przejście od objawu przez wywiad i pomiary do testu potwierdzającego.</text>
<rect x="110" y="370" width="230" height="145" rx="18" fill="#102e50" stroke="#ff6b79" stroke-width="3"/><text x="225.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">OBJAW</text><text x="225.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">zapisz warunki</text><rect x="430" y="370" width="230" height="145" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="545.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">WYWIAD</text><text x="545.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">kiedy / po czym</text><rect x="750" y="370" width="230" height="145" rx="18" fill="#102e50" stroke="#36e0d0" stroke-width="3"/><text x="865.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">POMIARY</text><text x="865.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">wartości i warunki</text><rect x="1070" y="370" width="230" height="145" rx="18" fill="#102e50" stroke="#ffbd59" stroke-width="3"/><text x="1185.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">HIPOTEZA</text><text x="1185.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">jedna przyczyna</text><rect x="1370" y="370" width="150" height="145" rx="18" fill="#102e50" stroke="#4be28b" stroke-width="3"/><text x="1445.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">TEST</text><text x="1445.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">potwierdź</text><path d="M340 445 L430 445" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M660 445 L750 445" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M980 445 L1070 445" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1300 445 L1390 445" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="500" y="640" width="600" height="105" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="800.0" y="682" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">DOKUMENTACJA</text><text x="800.0" y="715" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">objaw • wynik • część • test końcowy • ograniczenia</text><path d="M1450 515 L800 640" stroke="#4be28b" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="800" y="790" text-anchor="middle" fill="#ffbd59" font-family="Arial,sans-serif" font-size="20" font-weight="600">Nie wymieniaj części na podstawie przypuszczenia. Każdy krok powinien redukować liczbę hipotez.</text>
<rect x="28" y="836" width="1544" height="36" rx="10" fill="#0a1d33" stroke="#294e70"/>
<text x="58" y="860" fill="#9db9d3" font-family="Arial,sans-serif" font-size="17">Materiał edukacyjny — weryfikuj oznaczenia z dokumentacją producenta i rewizją urządzenia.</text>
</svg>