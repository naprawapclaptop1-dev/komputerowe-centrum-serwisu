<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">BIOS / UEFI — sekwencja rozruchu</title><desc id="desc">Uproszczony przepływ zasilania, EC, SPI firmware, POST i bootloadera.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#0b2340"/></linearGradient>
 <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0d3f6a"/><stop offset="1" stop-color="#0b2644"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1d7e8"/><stop offset=".5" stop-color="#567d9e"/><stop offset="1" stop-color="#dce9f4"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a5275" stroke-opacity=".22" stroke-width="1"/></pattern>
 <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#36e0d0"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><rect width="1600" height="900" rx="32" fill="url(#grid)"/>
<rect x="28" y="26" width="1544" height="128" rx="24" fill="url(#head)" stroke="#3d80b5" stroke-width="2"/>
<text x="70" y="72" fill="#36e0d0" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">ATLAS TECHNICZNY / FIX51</text>
<text x="70" y="119" fill="#eff7ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">BIOS / UEFI — sekwencja rozruchu</text>
<text x="70" y="196" fill="#a9c2da" font-family="Arial,sans-serif" font-size="24">Uproszczony przepływ zasilania, EC, SPI firmware, POST i bootloadera.</text>
<rect x="120" y="380" width="250" height="140" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="245.0" y="422" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">POWER</text><text x="245.0" y="455" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">zasilanie standby</text><rect x="470" y="380" width="250" height="140" rx="18" fill="#102e50" stroke="#36e0d0" stroke-width="3"/><text x="595.0" y="422" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">EC / KBC</text><text x="595.0" y="455" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">sekwencja startowa</text><rect x="820" y="380" width="250" height="140" rx="18" fill="#102e50" stroke="#ffbd59" stroke-width="3"/><text x="945.0" y="422" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">SPI BIOS</text><text x="945.0" y="455" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">firmware</text><rect x="1170" y="380" width="300" height="140" rx="18" fill="#102e50" stroke="#4be28b" stroke-width="3"/><text x="1320.0" y="422" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">POST</text><text x="1320.0" y="455" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">inicjalizacja sprzętu</text><path d="M370 450 L470 450" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M720 450 L820 450" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1070 450 L1170 450" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="460" y="620" width="270" height="105" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="595.0" y="662" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">UEFI BOOT</text><text x="595.0" y="695" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">wybór urządzenia</text><rect x="900" y="620" width="270" height="105" rx="18" fill="#102e50" stroke="#4be28b" stroke-width="3"/><text x="1035.0" y="662" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">BOOTLOADER</text><text x="1035.0" y="695" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">start systemu</text><path d="M1320 520 L600 620" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M730 670 L900 670" stroke="#4be28b" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="800" y="785" text-anchor="middle" fill="#ffbd59" font-family="Arial,sans-serif" font-size="20" font-weight="600">Przed aktualizacją BIOS: potwierdź model, rewizję, zasilanie i klucz odzyskiwania BitLocker.</text>
<rect x="28" y="836" width="1544" height="36" rx="10" fill="#0a1d33" stroke="#294e70"/>
<text x="58" y="860" fill="#9db9d3" font-family="Arial,sans-serif" font-size="17">Materiał edukacyjny — weryfikuj oznaczenia z dokumentacją producenta i rewizją urządzenia.</text>
</svg>