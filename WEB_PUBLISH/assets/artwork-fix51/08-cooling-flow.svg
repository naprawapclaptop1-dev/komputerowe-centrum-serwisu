<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Układ chłodzenia — przepływ energii</title><desc id="desc">Droga ciepła od CPU/GPU przez pastę, heatpipe i radiator do strumienia powietrza.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#0b2340"/></linearGradient>
 <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0d3f6a"/><stop offset="1" stop-color="#0b2644"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1d7e8"/><stop offset=".5" stop-color="#567d9e"/><stop offset="1" stop-color="#dce9f4"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a5275" stroke-opacity=".22" stroke-width="1"/></pattern>
 <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#36e0d0"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><rect width="1600" height="900" rx="32" fill="url(#grid)"/>
<rect x="28" y="26" width="1544" height="128" rx="24" fill="url(#head)" stroke="#3d80b5" stroke-width="2"/>
<text x="70" y="72" fill="#36e0d0" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">ATLAS TECHNICZNY / FIX51</text>
<text x="70" y="119" fill="#eff7ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Układ chłodzenia — przepływ energii</text>
<text x="70" y="196" fill="#a9c2da" font-family="Arial,sans-serif" font-size="24">Droga ciepła od CPU/GPU przez pastę, heatpipe i radiator do strumienia powietrza.</text>
<rect x="120" y="390" width="240" height="150" rx="18" fill="#102e50" stroke="#ff6b79" stroke-width="3"/><text x="240.0" y="432" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">CPU / GPU</text><text x="240.0" y="465" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">źródło ciepła</text><rect x="520" y="390" width="300" height="150" rx="18" fill="#102e50" stroke="#ffbd59" stroke-width="3"/><text x="670.0" y="432" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">HEAT PIPE</text><text x="670.0" y="465" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">transport energii</text><rect x="1000" y="390" width="220" height="150" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="1110.0" y="432" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">RADIATOR</text><text x="1110.0" y="465" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">oddawanie ciepła</text><rect x="1300" y="390" width="180" height="150" rx="18" fill="#102e50" stroke="#4be28b" stroke-width="3"/><text x="1390.0" y="432" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">WENTYLATOR</text><text x="1390.0" y="465" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">przepływ powietrza</text><path d="M360 465 L520 465" stroke="#ff6b79" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="440.0" y="451.0" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="18">ciepło</text><path d="M820 465 L1000 465" stroke="#ffbd59" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1220 465 L1300 465" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="1260.0" y="451.0" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="18">powietrze</text><rect x="480" y="640" width="280" height="105" rx="18" fill="#102e50" stroke="#36e0d0" stroke-width="3"/><text x="620.0" y="682" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">PASTA / PAD</text><text x="620.0" y="715" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">kontakt termiczny</text><rect x="870" y="640" width="280" height="105" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="1010.0" y="682" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">ŻEBERKA</text><text x="1010.0" y="715" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">czyste kanały</text><path d="M650 540 L620 640" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1110 540 L1010 640" stroke="#27a8ff" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="800" y="800" text-anchor="middle" fill="#ffbd59" font-family="Arial,sans-serif" font-size="20" font-weight="600">Zatkane kanały, słaby docisk lub zły pad mogą pogarszać temperatury mimo pracy wentylatora.</text>
<rect x="28" y="836" width="1544" height="36" rx="10" fill="#0a1d33" stroke="#294e70"/>
<text x="58" y="860" fill="#9db9d3" font-family="Arial,sans-serif" font-size="17">Materiał edukacyjny — weryfikuj oznaczenia z dokumentacją producenta i rewizją urządzenia.</text>
</svg>