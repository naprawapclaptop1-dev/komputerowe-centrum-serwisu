<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Sieć Wi-Fi — ścieżka diagnostyczna</title><desc id="desc">Rozdzielenie problemów operatora, routera, pasma radiowego, sterownika i klienta.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#0b2340"/></linearGradient>
 <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0d3f6a"/><stop offset="1" stop-color="#0b2644"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1d7e8"/><stop offset=".5" stop-color="#567d9e"/><stop offset="1" stop-color="#dce9f4"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a5275" stroke-opacity=".22" stroke-width="1"/></pattern>
 <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#36e0d0"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><rect width="1600" height="900" rx="32" fill="url(#grid)"/>
<rect x="28" y="26" width="1544" height="128" rx="24" fill="url(#head)" stroke="#3d80b5" stroke-width="2"/>
<text x="70" y="72" fill="#36e0d0" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">ATLAS TECHNICZNY / FIX51</text>
<text x="70" y="119" fill="#eff7ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Sieć Wi-Fi — ścieżka diagnostyczna</text>
<text x="70" y="196" fill="#a9c2da" font-family="Arial,sans-serif" font-size="24">Rozdzielenie problemów operatora, routera, pasma radiowego, sterownika i klienta.</text>
<rect x="130" y="370" width="260" height="150" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="260.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">MODEM / WAN</text><text x="260.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">łącze operatora</text><rect x="500" y="370" width="260" height="150" rx="18" fill="#102e50" stroke="#36e0d0" stroke-width="3"/><text x="630.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">ROUTER</text><text x="630.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">NAT / DHCP / firewall</text><rect x="880" y="280" width="250" height="120" rx="18" fill="#102e50" stroke="#4be28b" stroke-width="3"/><text x="1005.0" y="322" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">WI-FI 2.4 GHz</text><text x="1005.0" y="355" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">zasięg / zakłócenia</text><rect x="880" y="480" width="250" height="120" rx="18" fill="#102e50" stroke="#ffbd59" stroke-width="3"/><text x="1005.0" y="522" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">WI-FI 5 / 6 GHz</text><text x="1005.0" y="555" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">kanał / szerokość</text><rect x="1260" y="370" width="220" height="150" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="1370.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">KLIENT</text><text x="1370.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">sterownik / anteny</text><path d="M390 445 L500 445" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M760 420 L880 340" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M760 475 L880 540" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1130 340 L1260 420" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1130 540 L1260 470" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="800" y="740" text-anchor="middle" fill="#ffbd59" font-family="Arial,sans-serif" font-size="21" font-weight="600">Weryfikuj osobno: łącze WAN, konfigurację routera, pasmo, kanał, sterownik i anteny.</text>
<rect x="28" y="836" width="1544" height="36" rx="10" fill="#0a1d33" stroke="#294e70"/>
<text x="58" y="860" fill="#9db9d3" font-family="Arial,sans-serif" font-size="17">Materiał edukacyjny — weryfikuj oznaczenia z dokumentacją producenta i rewizją urządzenia.</text>
</svg>