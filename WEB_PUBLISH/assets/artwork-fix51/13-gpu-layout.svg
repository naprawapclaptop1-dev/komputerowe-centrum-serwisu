<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Karta graficzna — GPU, VRAM i VRM</title><desc id="desc">Poglądowa mapa głównych bloków GPU, pamięci VRAM, sekcji zasilania i chłodzenia.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#0b2340"/></linearGradient>
 <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0d3f6a"/><stop offset="1" stop-color="#0b2644"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1d7e8"/><stop offset=".5" stop-color="#567d9e"/><stop offset="1" stop-color="#dce9f4"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a5275" stroke-opacity=".22" stroke-width="1"/></pattern>
 <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#36e0d0"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><rect width="1600" height="900" rx="32" fill="url(#grid)"/>
<rect x="28" y="26" width="1544" height="128" rx="24" fill="url(#head)" stroke="#3d80b5" stroke-width="2"/>
<text x="70" y="72" fill="#36e0d0" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">ATLAS TECHNICZNY / FIX51</text>
<text x="70" y="119" fill="#eff7ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Karta graficzna — GPU, VRAM i VRM</text>
<text x="70" y="196" fill="#a9c2da" font-family="Arial,sans-serif" font-size="24">Poglądowa mapa głównych bloków GPU, pamięci VRAM, sekcji zasilania i chłodzenia.</text>
<rect x="250" y="330" width="1100" height="360" rx="28" fill="#172c3d" stroke="#5da7e0" stroke-width="5"/><rect x="510" y="390" width="360" height="220" rx="18" fill="#101e2c" stroke="#ffbd59" stroke-width="4"/><text x="690" y="510" text-anchor="middle" fill="#ffbd59" font-family="Arial,sans-serif" font-size="36" font-weight="600">GPU CORE</text><rect x="340" y="390" width="130" height="85" rx="10" fill="#174b38" stroke="#79e9a2" stroke-width="3"/><text x="405" y="442" text-anchor="middle" fill="#4be28b" font-family="Arial,sans-serif" font-size="22" font-weight="600">VRAM</text><rect x="340" y="560" width="130" height="85" rx="10" fill="#174b38" stroke="#79e9a2" stroke-width="3"/><text x="405" y="612" text-anchor="middle" fill="#4be28b" font-family="Arial,sans-serif" font-size="22" font-weight="600">VRAM</text><rect x="950" y="390" width="130" height="85" rx="10" fill="#174b38" stroke="#79e9a2" stroke-width="3"/><text x="1015" y="442" text-anchor="middle" fill="#4be28b" font-family="Arial,sans-serif" font-size="22" font-weight="600">VRAM</text><rect x="950" y="560" width="130" height="85" rx="10" fill="#174b38" stroke="#79e9a2" stroke-width="3"/><text x="1015" y="612" text-anchor="middle" fill="#4be28b" font-family="Arial,sans-serif" font-size="22" font-weight="600">VRAM</text><rect x="600" y="245" width="180" height="75" rx="18" fill="#102e50" stroke="#ff6b79" stroke-width="3"/><text x="690.0" y="287" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">VRM</text><text x="690.0" y="320" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">fazy zasilania</text><path d="M690 320 L690 390" stroke="#ff6b79" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="220" y="665" width="300" height="85" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="370.0" y="707" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">PCIe</text><text x="370.0" y="740" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">interfejs hosta</text><rect x="650" y="665" width="300" height="85" rx="18" fill="#102e50" stroke="#36e0d0" stroke-width="3"/><text x="800.0" y="707" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">CHŁODZENIE</text><text x="800.0" y="740" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">radiator / wentylatory</text><rect x="1080" y="665" width="300" height="85" rx="18" fill="#102e50" stroke="#4be28b" stroke-width="3"/><text x="1230.0" y="707" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">VRAM</text><text x="1230.0" y="740" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">temperatury / testy</text><text x="800" y="790" text-anchor="middle" fill="#ffbd59" font-family="Arial,sans-serif" font-size="20" font-weight="600">Testuj temperaturę, zasilanie i pamięć osobno; artefakty nie wskazują jednej przyczyny.</text>
<rect x="28" y="836" width="1544" height="36" rx="10" fill="#0a1d33" stroke="#294e70"/>
<text x="58" y="860" fill="#9db9d3" font-family="Arial,sans-serif" font-size="17">Materiał edukacyjny — weryfikuj oznaczenia z dokumentacją producenta i rewizją urządzenia.</text>
</svg>