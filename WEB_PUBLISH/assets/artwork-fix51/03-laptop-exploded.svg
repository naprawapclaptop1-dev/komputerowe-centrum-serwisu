<text x="70" y="119" fill="#eff7ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Laptop — widok warstwowy i podzespoły</text>
<text x="70" y="196" fill="#a9c2da" font-family="Arial,sans-serif" font-size="24">Schemat warstwowy obudowy, matrycy, płyty, chłodzenia, baterii, SSD i zawiasów.</text>
