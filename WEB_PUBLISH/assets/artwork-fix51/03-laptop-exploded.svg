="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M940 395 L1000 395" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1190 395 L1250 395" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="270" y="570" width="250" height="105" rx="18" fill="#102e50" stroke="#ffbd59" stroke-width="3"/><text x="395.0" y="612" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">BATERIA</text><text x="395.0" y="645" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">Li-ion / Li-pol</text><rect x="680" y="570" width="250" height="105" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="805.0" y="612" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">GŁOŚNIKI</text><text x="805.0" y="645" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">audio / przewody</text><rect x="1090" y="570" width="250" height="105" rx="18" fill="#102e50" stroke="#4be28b" stroke-width="3"/><text x="1215.0" y="612" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">DOLNA POKRYWA</text><text x="1215.0" y="645" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">śruby / zatrzaski</text><path d="M520 620 L680 430" stroke="#ffbd59" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M805 570 L805 470" stroke="#27a8ff" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1210 570 L1120 470" stroke="#4be28b" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="140" y="760" text-anchor="start" fill="#ffbd59" font-family="Arial,sans-serif" font-size="22" font-weight="600">Demontaż wykonuj według instrukcji serwisowej. Odłącz zasilacz i baterię przed pracą.</text>
