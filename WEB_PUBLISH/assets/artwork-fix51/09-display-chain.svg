<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Tor obrazu laptopa — eDP i podświetlenie</title><desc id="desc">Zależności między GPU, taśmą eDP, panelem LCD, zawiasem i zasilaniem LED.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#0b2340"/></linearGradient>
 <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0d3f6a"/><stop offset="1" stop-color="#0b2644"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1d7e8"/><stop offset=".5" stop-color="#567d9e"/><stop offset="1" stop-color="#dce9f4"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a5275" stroke-opacity=".22" stroke-width="1"/></pattern>
 <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#36e0d0"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><rect width="1600" height="900" rx="32" fill="url(#grid)"/>
<rect x="28" y="26" width="1544" height="128" rx="24" fill="url(#head)" stroke="#3d80b5" stroke-width="2"/>
<text x="70" y="72" fill="#36e0d0" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">ATLAS TECHNICZNY / FIX51</text>
<text x="70" y="119" fill="#eff7ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Tor obrazu laptopa — eDP i podświetlenie</text>
<text x="70" y="196" fill="#a9c2da" font-family="Arial,sans-serif" font-size="24">Zależności między GPU, taśmą eDP, panelem LCD, zawiasem i zasilaniem LED.</text>
<rect x="130" y="370" width="240" height="140" rx="18" fill="#102e50" stroke="#27a8ff" stroke-width="3"/><text x="250.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">GPU / iGPU</text><text x="250.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">sygnał obrazu</text><rect x="480" y="370" width="240" height="140" rx="18" fill="#102e50" stroke="#36e0d0" stroke-width="3"/><text x="600.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">eDP / LVDS</text><text x="600.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">taśma sygnałowa</text><rect x="830" y="370" width="240" height="140" rx="18" fill="#102e50" stroke="#ffbd59" stroke-width="3"/><text x="950.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">PANEL LCD</text><text x="950.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">matryca</text><rect x="1180" y="370" width="280" height="140" rx="18" fill="#102e50" stroke="#4be28b" stroke-width="3"/><text x="1320.0" y="412" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">BACKLIGHT</text><text x="1320.0" y="445" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">podświetlenie</text><path d="M370 440 L480 440" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M720 440 L830 440" stroke="#36e0d0" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1070 440 L1180 440" stroke="#ffbd59" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><rect x="470" y="625" width="260" height="100" rx="18" fill="#102e50" stroke="#ffbd59" stroke-width="3"/><text x="600.0" y="667" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">ZAWIAS</text><text x="600.0" y="700" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">prowadzenie taśmy</text><rect x="900" y="625" width="260" height="100" rx="18" fill="#102e50" stroke="#4be28b" stroke-width="3"/><text x="1030.0" y="667" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="25" font-weight="700">ZASILANIE LED</text><text x="1030.0" y="700" text-anchor="middle" fill="#a9c2da" font-family="Arial,sans-serif" font-size="18">driver</text><path d="M600 510 L600 625" stroke="#ffbd59" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><path d="M1320 510 L1030 625" stroke="#4be28b" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="800" y="790" text-anchor="middle" fill="#ffbd59" font-family="Arial,sans-serif" font-size="22" font-weight="600">Czarny ekran nie wskazuje automatycznie na uszkodzoną matrycę — sprawdź cały tor.</text>
<rect x="28" y="836" width="1544" height="36" rx="10" fill="#0a1d33" stroke="#294e70"/>
<text x="58" y="860" fill="#9db9d3" font-family="Arial,sans-serif" font-size="17">Materiał edukacyjny — weryfikuj oznaczenia z dokumentacją producenta i rewizją urządzenia.</text>
</svg>