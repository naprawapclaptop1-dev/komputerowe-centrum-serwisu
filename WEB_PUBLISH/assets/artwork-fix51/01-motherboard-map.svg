<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Mapa płyty głównej ATX / laptop</title><desc id="desc">Rozpoznawanie stref płyty: CPU, RAM, VRM, PCIe, M.2, chipset i I/O.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#0b2340"/></linearGradient>
 <linearGradient id="head" x1="0" x2="1"><stop stop-color="#0d3f6a"/><stop offset="1" stop-color="#0b2644"/></linearGradient>
 <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c1d7e8"/><stop offset=".5" stop-color="#567d9e"/><stop offset="1" stop-color="#dce9f4"/></linearGradient>
 <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a5275" stroke-opacity=".22" stroke-width="1"/></pattern>
 <marker id="arr" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L14 7 L0 14 Z" fill="#36e0d0"/></marker>
</defs>
<rect width="1600" height="900" rx="32" fill="url(#bg)"/><rect width="1600" height="900" rx="32" fill="url(#grid)"/>
<rect x="28" y="26" width="1544" height="128" rx="24" fill="url(#head)" stroke="#3d80b5" stroke-width="2"/>
<text x="70" y="72" fill="#36e0d0" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="4">ATLAS TECHNICZNY / FIX51</text>
<text x="70" y="119" fill="#eff7ff" font-family="Arial,sans-serif" font-size="42" font-weight="700">Mapa płyty głównej ATX / laptop</text>
<text x="70" y="196" fill="#a9c2da" font-family="Arial,sans-serif" font-size="24">Rozpoznawanie stref płyty: CPU, RAM, VRM, PCIe, M.2, chipset i I/O.</text>
<rect x="260" y="280" width="1040" height="480" rx="28" fill="#153b4b" stroke="#56b5ce" stroke-width="5"/><rect x="320" y="345" width="330" height="250" rx="20" fill="#0c1b2b" stroke="#8ac6e7" stroke-width="5"/><text x="485" y="390" text-anchor="middle" fill="#36e0d0" font-family="Arial,sans-serif" font-size="24" font-weight="600">SOCKET CPU</text><rect x="800" y="330" width="125" height="270" rx="12" fill="#215e36" stroke="#6bdf98" stroke-width="4"/><text x="862" y="305" text-anchor="middle" fill="#4be28b" font-family="Arial,sans-serif" font-size="22" font-weight="600">RAM</text><rect x="818" y="355" width="88" height="48" rx="6" fill="#3c9c59" stroke="#bcffce" stroke-width="2"/><path d="M830 365h64" stroke="#d5ffe0"/><rect x="818" y="355" width="88" height="48" rx="6" fill="#3c9c59" stroke="#bcffce" stroke-width="2"/><path d="M830 365h64" stroke="#d5ffe0"/><rect x="818" y="355" width="88" height="48" rx="6" fill="#3c9c59" stroke="#bcffce" stroke-width="2"/><path d="M830 365h64" stroke="#d5ffe0"/><rect x="818" y="355" width="88" height="48" rx="6" fill="#3c9c59" stroke="#bcffce" stroke-width="2"/><path d="M830 365h64" stroke="#d5ffe0"/><rect x="1020" y="360" width="180" height="110" rx="12" fill="#13283d" stroke="#ffbd59" stroke-width="4"/><text x="1110" y="405" text-anchor="middle" fill="#ffbd59" font-family="Arial,sans-serif" font-size="26" font-weight="600">VRM</text><rect x="720" y="660" width="360" height="58" rx="8" fill="#182f4a" stroke="#5bc7ff" stroke-width="3"/><text x="900" y="698" text-anchor="middle" fill="#36e0d0" font-family="Arial,sans-serif" font-size="22" font-weight="600">PCIe x16</text><rect x="390" y="660" width="250" height="50" rx="8" fill="#183b55" stroke="#ffbd59" stroke-width="3"/><text x="515" y="694" text-anchor="middle" fill="#ffbd59" font-family="Arial,sans-serif" font-size="22" font-weight="600">M.2 NVMe</text><path d="M650 460 L800 460" stroke="#4be28b" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="725.0" y="446.0" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="18">kanały pamięci</text><path d="M1020 420 L950 460" stroke="#ffbd59" stroke-width="7" fill="none" stroke-linecap="round" marker-end="url(#arr)"/><text x="985.0" y="426.0" text-anchor="middle" fill="#eff7ff" font-family="Arial,sans-serif" font-size="18">zasilanie CPU</text><text x="1320" y="350" text-anchor="start" fill="#36e0d0" font-family="Arial,sans-serif" font-size="22" font-weight="600">CHIPSET</text><text x="1320" y="385" text-anchor="start" fill="#36e0d0" font-family="Arial,sans-serif" font-size="22" font-weight="600">SATA</text><text x="1320" y="420" text-anchor="start" fill="#36e0d0" font-family="Arial,sans-serif" font-size="22" font-weight="600">BIOS / SPI</text><text x="1320" y="455" text-anchor="start" fill="#36e0d0" font-family="Arial,sans-serif" font-size="22" font-weight="600">USB / I/O</text><text x="260" y="800" text-anchor="start" fill="#ffbd59" font-family="Arial,sans-serif" font-size="19" font-weight="600">Rozmieszczenie elementów jest poglądowe — sprawdź boardview właściwej rewizji.</text>
<rect x="28" y="836" width="1544" height="36" rx="10" fill="#0a1d33" stroke="#294e70"/>
<text x="58" y="860" fill="#9db9d3" font-family="Arial,sans-serif" font-size="17">Materiał edukacyjny — weryfikuj oznaczenia z dokumentacją producenta i rewizją urządzenia.</text>
</svg>